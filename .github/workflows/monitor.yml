name: sale-monitor
on:
  schedule:
    - cron: '17 8 * * *'       # full scrape
    - cron: '17 2,14,20 * * *' # command drain only
  workflow_dispatch:
    inputs:
      mode:
        description: 'full or drain'
        default: full
permissions:
  contents: write
concurrency:
  group: sale-monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "17 8 * * *" ] || [ "${{ inputs.mode }}" = "full" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=drain" >> $GITHUB_OUTPUT
          fi
      - run: python -m src.main --mode ${{ steps.mode.outputs.mode }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      - name: Commit state
        run: |
          git config user.name  "sale-monitor[bot]"
          git config user.email "sale-monitor@users.noreply.github.com"
          git add watchlist.json state.json snapshots/
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
